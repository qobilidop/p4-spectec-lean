name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write # cache-nix-action stores the Nix store in the Actions cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The pinned P4-SpecTec and Nano-P4 spec checkouts; P4-SpecTec's own
          # nested submodules (p4c, nano-p4/spec) are not needed.
          submodules: true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 2G
      # The flake provides elan, not Lean; elan installs the toolchain that
      # lean-toolchain names into ~/.elan on first use. Cache it by that pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Run the gate
        run: nix develop --command scripts/check.sh
      # The pin follows upstream's `gsoc-nano-spec` branch until Nano-P4 lands
      # on main (decisions: "Pins"); either ref makes the pin reachable.
      # The submodule clone is shallow and single-branch, so its refspec
      # covers only `main`; explicit refspecs create the other tracking ref.
      - name: Upstream pin is on upstream main or the Nano-P4 branch
        run: |
          git -C upstream/p4-spectec fetch --quiet origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/gsoc-nano-spec:refs/remotes/origin/gsoc-nano-spec
          git -C upstream/p4-spectec merge-base --is-ancestor HEAD origin/main \
            || git -C upstream/p4-spectec merge-base --is-ancestor HEAD origin/gsoc-nano-spec
      - name: Nano-P4 spec pin is on its main
        run: |
          git -C upstream/nano-p4-spec fetch --quiet origin \
            +refs/heads/main:refs/remotes/origin/main
          git -C upstream/nano-p4-spec merge-base --is-ancestor HEAD origin/main
