# p4spectec: a compiler from P4-SpecTec's AL to Lean 4, its runtime prelude,
# and the generated Nano-P4 and full-P4 specifications. Add future libraries with their code.
# See docs/design.md section 4.2 for the library dependency boundaries.
name = "p4spectec"
version = "0.0.1"
# Tests and downstream examples are not default targets. The full gate runs
# `lake test` and explicitly builds ExampleProofs.
# Warnings fail the build through `lake build --wfail` in
# scripts/check.sh, not through warningAsError, which would also rewrite the
# severities that #guard_msgs tests observe.
defaultTargets = ["P4SpecTec", "NanoP4Spec", "NanoP4Target"]
testDriver = "P4SpecTecTest"

[leanOptions]
# Every declaration in a client-importable library carries a docstring.
linter.missingDocs = true
linter.unusedSimpArgs = true

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.34.0"

# Libraries: core semantics, generated model, downstream examples, then tests.
[[lean_lib]]
name = "P4SpecTec"

[[lean_lib]]
name = "NanoP4Spec"

# The concrete NanoSwitch target over the generated model: extern instance and contracts.
[[lean_lib]]
name = "NanoP4Target"

# The generated full-P4 model: executable definitions, quotations, logical relations and
# the run-soundness theorems generated so far. Its sources are generated into the ignored
# P4Spec/ and checked against P4Spec.manifest.json; the gate builds it explicitly.
[[lean_lib]]
name = "P4Spec"

[[lean_lib]]
name = "ExampleProofs"

# Build root-imported unit tests here; the gate builds oracle executables separately.
[[lean_lib]]
name = "P4SpecTecTest"
leanOptions = { linter.missingDocs = false }

# Generation, source identity, compiled certification and capability inventory.
[[lean_exe]]
name = "p4spectec-gen"
root = "Tools.Generate"

[[lean_exe]]
name = "check-quotes"
root = "Tools.CheckQuotes"

[[lean_exe]]
name = "check-p4-quotes"
root = "Tools.CheckP4Quotes"

[[lean_exe]]
name = "check-coverage"
root = "Tools.CheckCoverage"
needs = ["NanoP4Spec"]

[[lean_exe]]
name = "check-target"
root = "Tools.CheckTarget"
needs = ["NanoP4Target"]

# The whole-program consumer certificate: identity, upstream observation and claim types.
[[lean_exe]]
name = "check-consumer"
root = "Tools.CheckConsumer"
needs = ["ExampleProofs"]

# Typed quotation of an exported Nano program for whole-program statements.
[[lean_exe]]
name = "nano-program-quote"
root = "Tools.QuoteProgram"
needs = ["NanoP4Spec"]

[[lean_exe]]
name = "p4spectec-census"
root = "Tools.Census"

# Shared runtime observations against pinned upstream oracles.
[[lean_exe]]
name = "check-print"
root = "P4SpecTecTest.Oracle.Print.Main"

[[lean_exe]]
name = "check-state-oracle"
root = "P4SpecTecTest.Oracle.State.Main"

[[lean_exe]]
name = "check-text-builtins"
root = "P4SpecTecTest.Oracle.Text.Main"

# Paired Nano replay: generated typing followed by the AL reference interpreter.
[[lean_exe]]
name = "nano-p4-run"
root = "P4SpecTecTest.Oracle.Nano.Replay.Run.Main"

[[lean_exe]]
name = "nano-p4-interp"
root = "P4SpecTecTest.Oracle.Nano.Replay.Interp.Main"

# NanoSwitch operations precede packet-relation and driver composition.
[[lean_exe]]
name = "check-nano-target"
root = "P4SpecTecTest.Oracle.NanoSwitch.Target.Main"

[[lean_exe]]
name = "check-nano-verify"
root = "P4SpecTecTest.Oracle.NanoSwitch.Verify.Main"

[[lean_exe]]
name = "check-nano-packet"
root = "P4SpecTecTest.Oracle.NanoSwitch.Packets.Main"

[[lean_exe]]
name = "check-nano-driver"
root = "P4SpecTecTest.Oracle.NanoSwitch.Driver.Main"

# Complete STF sessions through both Lean paths against the pinned upstream simulator.
[[lean_exe]]
name = "check-nano-sessions"
root = "P4SpecTecTest.Oracle.NanoSwitch.Sessions.Main"

# Bounded full-P4 replay tools, one per Lean leg; the gate builds them and checks their
# harness contracts.
[[lean_exe]]
name = "p4-interp-replay"
root = "P4SpecTecTest.Oracle.P4.Replay.Main"

[[lean_exe]]
name = "p4-gen-replay"
root = "P4SpecTecTest.Oracle.P4.Generated.Main"

# Corpus campaign workers, one per Lean leg; no corpus execution in the ordinary gate.
[[lean_exe]]
name = "p4-corpus-worker"
root = "P4SpecTecTest.Oracle.P4.Corpus.Main"

[[lean_exe]]
name = "p4-corpus-worker-gen"
root = "P4SpecTecTest.Oracle.P4.Corpus.Generated.Main"
