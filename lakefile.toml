# p4spectec: a compiler from P4-SpecTec's AL to Lean 4, its runtime prelude,
# the generated P4 specifications, and a small P4 primitives library.
# See docs/design.md section 4.2 for the library dependency boundaries.
name = "p4spectec"
version = "0.0.1"
# Tests and downstream examples are not default targets. The full gate runs
# `lake test` and explicitly builds ExampleProofs.
# Warnings fail the build through `lake build --wfail` in
# scripts/check.sh, not through warningAsError, which would also rewrite the
# severities that #guard_msgs tests observe.
defaultTargets = ["P4SpecTec", "P4Lib", "NanoP4Spec", "P4Spec"]
testDriver = "P4SpecTecTest"

[leanOptions]
# Every declaration in a client-importable library carries a docstring.
linter.missingDocs = true
linter.unusedSimpArgs = true

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.34.0"

# Core: IL/AL syntax, AL semantics, prelude, codegen, validation tactics.
[[lean_lib]]
name = "P4SpecTec"

# Test-only modules: mirror checks, prelude vs builtins, decode round-trips,
# #guard_msgs files. Every module under P4SpecTecTest/ is built by `lake test`.
[[lean_lib]]
name = "P4SpecTecTest"
globs = ["P4SpecTecTest", "P4SpecTecTest.+"]
leanOptions = { linter.missingDocs = false }

# P4 primitives for downstream users; independent of the generated specs.
[[lean_lib]]
name = "P4Lib"

# Pilot: the Nano-P4 specification, generated from exports/nano-p4.al.json.
[[lean_lib]]
name = "NanoP4Spec"

# The full P4 specification, generated from exports/p4.al.json (M3).
[[lean_lib]]
name = "P4Spec"

# Downstream verification examples; not a reusable semantics/proof library.
[[lean_lib]]
name = "ExampleProofs"

# The compiler: reads AL exports and writes one generated .lean module per
# upstream spec file. `--update` refreshes committed output; CI diffs it.
[[lean_exe]]
name = "p4spectec-gen"
root = "P4SpecTec.Codegen.Main"

# The Lean side of the differential harness: decode booted Nano-P4 programs
# and run the generated typing relation on them (test/diff/run.py drives it).
[[lean_exe]]
name = "nano-p4-run"
root = "P4SpecTecTest.Diff.NanoP4Run.Main"

# The second leg: the Lean port of the AL interpreter on the same programs.
[[lean_exe]]
name = "nano-p4-interp"
root = "P4SpecTecTest.Diff.NanoP4Interp.Main"

# Full-P4 interpreter replay against the pinned typed-value oracle.
[[lean_exe]]
name = "p4-interp-replay"
root = "P4SpecTecTest.Diff.P4Interp.Main"

# Corpus-v2 spec-once streaming worker; no corpus execution in the ordinary gate.
[[lean_exe]]
name = "p4-corpus-worker"
root = "P4SpecTecTest.Diff.P4Corpus.Main"

# The compiled quoted AST must match the current export, modulo regions/hints.
[[lean_exe]]
name = "check-quotes"
root = "P4SpecTecTest.Quote.Main"

# Read-only emission probes and dependency census, including unsupported specs.
[[lean_exe]]
name = "p4spectec-census"
root = "P4SpecTecTest.Census.Main"

# Exact print-hint outputs observed from the pinned upstream printer.
[[lean_exe]]
name = "check-print"
root = "P4SpecTecTest.Print.Main"

# Byte-level text builtin outputs observed from pinned upstream OCaml.
[[lean_exe]]
name = "check-text-builtins"
root = "P4SpecTecTest.Text.Main"

# Stateful AL interpreter observations from the pinned upstream revision.
[[lean_exe]]
name = "check-state-oracle"
root = "P4SpecTecTest.StateOracle.Main"

# Bounded packet data and raw dynamic target observations at the exact upstream pin.
[[lean_exe]]
name = "check-nano-target"
root = "P4SpecTecTest.NanoTargetOracle.Main"

# Actual AL packet-driving relation replay with the bounded dynamic Nano target.
[[lean_exe]]
name = "check-nano-packet"
root = "P4SpecTecTest.NanoPacket.Main"

# Original dynamic Nano driver observations, including failure post-state.
[[lean_exe]]
name = "check-nano-driver"
root = "P4SpecTecTest.NanoDriver.Main"

# Shared verify and Nano dispatch; Nano source-level verify remains unreachable.
[[lean_exe]]
name = "check-nano-verify"
root = "P4SpecTecTest.NanoVerify.Main"
